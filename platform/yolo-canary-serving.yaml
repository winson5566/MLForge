# A pre-traffic local Canary.  The alias is switched only by the governed
# promotion workflow.  On a GPU/x86 cluster this contract is implemented by a
# Triton deployment plus Argo Rollouts/Istio weighted routing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yolo-local-canary
  namespace: ml-platform
  labels:
    app.kubernetes.io/name: yolo-local-canary
    app.kubernetes.io/part-of: mlforge
    mlforge.ai/rollout-stage: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: yolo-local-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yolo-local-canary
        mlforge.ai/rollout-stage: canary
    spec:
      containers:
        - name: server
          image: mlforge/yolo-canary-server:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.ml-platform.svc.cluster.local:5000
            - name: MODEL_NAME
              value: label-studio-project-1-yolo-detector
            - name: MODEL_ALIAS
              value: demo-champion
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 3Gi}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: yolo-local-canary
  namespace: ml-platform
  labels:
    app.kubernetes.io/name: yolo-local-canary
spec:
  selector:
    app.kubernetes.io/name: yolo-local-canary
  ports:
    - name: http
      port: 8080
      targetPort: http
