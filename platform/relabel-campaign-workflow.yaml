apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: prepare-labelstudio-relabel-campaign
  namespace: ml-platform
  labels:
    app.kubernetes.io/part-of: mlforge
spec:
  schedules: ["*/5 * * * *"]
  concurrencyPolicy: Forbid
  workflowSpec:
    serviceAccountName: argo-workflow
    entrypoint: prepare
    ttlStrategy: {secondsAfterCompletion: 86400}
    templates:
      - name: prepare
        container:
          image: mlforge/label-release:0.1.3
          imagePullPolicy: IfNotPresent
          command: [python, -m, mlforge_platform.relabel_campaign]
          args: [--project-id, "1", --batch-size, "25"]
          env:
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: LABEL_STUDIO_URL, value: http://label-studio-ls-app.ml-platform.svc.cluster.local}
            - name: LABEL_STUDIO_TOKEN
              valueFrom: {secretKeyRef: {name: labelstudio-api, key: token}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
