apiVersion: v1
kind: ConfigMap
metadata:
  name: voc2007-labelstudio-proxy
  namespace: ml-platform
data:
  update.py: |
    import json
    import os
    from urllib.request import Request, urlopen

    base = "http://label-studio-ls-app.ml-platform.svc.cluster.local"
    refresh = Request(
        f"{base}/api/token/refresh",
        data=json.dumps({"refresh": os.environ["LABEL_STUDIO_API_TOKEN"]}).encode(),
        headers={"Content-Type": "application/json"},
        method="POST",
    )
    with urlopen(refresh, timeout=30) as response:
        token = json.load(response)["access"]

    request = Request(
        f"{base}/api/storages/s3/1",
        data=json.dumps({"presign": False}).encode(),
        headers={
            "Authorization": f"Bearer {token}",
            "Content-Type": "application/json",
        },
        method="PATCH",
    )
    with urlopen(request, timeout=30) as response:
        storage = json.load(response)
    print(json.dumps({"storage_id": storage["id"], "presign": storage["presign"]}))
---
apiVersion: batch/v1
kind: Job
metadata:
  name: voc2007-labelstudio-proxy
  namespace: ml-platform
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: update
          image: mlforge/mlflow:3.15.1
          command: ["python", "/scripts/update.py"]
          env:
            - name: LABEL_STUDIO_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: labelstudio-api
                  key: token
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 512Mi}
      volumes:
        - name: scripts
          configMap:
            name: voc2007-labelstudio-proxy
