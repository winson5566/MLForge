apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: canary-rollback
  namespace: ml-platform
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["yolo-local-canary"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["labeling-demand"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: canary-rollback
  namespace: ml-platform
subjects:
  - kind: ServiceAccount
    name: argo-workflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: canary-rollback
