name: Data release pipeline

on:
  pull_request:
    paths:
      - "data/**"
      - "src/**"
      - "platform/**"
      - ".github/workflows/**"
      - ".dvc/**"
      - "dvc.yaml"
  push:
    branches: [main]
    paths:
      - "data/releases/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-data-release:
    if: github.event_name == 'pull_request'
    # This runner must be installed on the Mac that hosts K3d. GitHub-hosted
    # runners cannot reach the private MinIO and Kubernetes endpoints.
    runs-on: [self-hosted, mlforge]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DVC_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DVC_S3_SECRET_ACCESS_KEY }}
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
        with:
          # The report must diff the immutable PR head against its base,
          # rather than pick an arbitrary historical release on disk.
          fetch-depth: 0
      - uses: iterative/setup-cml@v2
      - name: Resolve the data release under review
        id: release
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          paths=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep -E '^data/releases/project-[0-9]+/.+\.dvc$' || true)
          count=$(printf '%s\n' "$paths" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$count" = 0 ]; then
            echo 'has_release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$count" = 1
          path="$paths"
          printf 'has_release=true\ndvc_path=%s\nmanifest_path=%s\n' \
            "$path" "${path%.dvc}/manifest.json" >> "$GITHUB_OUTPUT"
      - name: Fetch the versioned data
        env:
          DVC_PATH: ${{ steps.release.outputs.dvc_path }}
        run: |
          if [ -n "$DVC_PATH" ]; then
            dvc pull "$DVC_PATH"
          else
            dvc pull
          fi
      - name: Summarize the candidate data release
        env:
          HAS_RELEASE: ${{ steps.release.outputs.has_release }}
          MANIFEST: ${{ steps.release.outputs.manifest_path }}
        run: |
          if [ "$HAS_RELEASE" = true ]; then
            test -f "$MANIFEST"
            python3 -m mlforge_platform.data_release_report --manifest "$MANIFEST" --output report.md
          else
            printf '## MLForge data-release review\n\n✅ DVC data is reachable. No release manifest is present in this PR.\n' > report.md
          fi
      - name: Create a pull-request report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cml comment create report.md

  train-candidate:
    if: github.event_name == 'push'
    runs-on: [self-hosted, mlforge]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select the published data release
        id: release
        run: |
          paths=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
            | grep -E '^data/releases/project-[0-9]+/.+\.dvc$' || true)
          count=$(printf '%s\n' "$paths" | sed '/^$/d' | wc -l | tr -d ' ')
          test "$count" = 1
          path="$paths"
          project_id=$(printf '%s' "$path" | sed -E 's#^data/releases/project-([0-9]+)/.*#\1#')
          release_id=$(basename "$path" .dvc)
          printf 'path=%s\nproject_id=%s\nrelease_id=%s\n' "$path" "$project_id" "$release_id" >> "$GITHUB_OUTPUT"
      - name: Submit Argo training workflow
        id: argo
        env:
          DATA_RELEASE_PATH: ${{ steps.release.outputs.path }}
          PROJECT_ID: ${{ steps.release.outputs.project_id }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          workflow=$(cat <<EOF | kubectl --context k3d-workload -n ml-platform create -f - -o name
          apiVersion: argoproj.io/v1alpha1
          kind: Workflow
          metadata:
            generateName: train-candidate-
            labels:
              app.kubernetes.io/part-of: mlforge
              mlforge.ai/trigger: data-release-merge
          spec:
            workflowTemplateRef:
              name: train-mlflow-candidate
            arguments:
              parameters:
                - name: repository
                  value: ${{ github.repository }}
                - name: data-release-path
                  value: $DATA_RELEASE_PATH
                - name: release-id
                  value: $RELEASE_ID
                - name: project-id
                  value: "$PROJECT_ID"
                - name: git-sha
                  value: ${{ github.sha }}
          EOF
          )
          printf 'workflow=%s\n' "$workflow" >> "$GITHUB_OUTPUT"
      - name: Publish submission summary
        env:
          WORKFLOW: ${{ steps.argo.outputs.workflow }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          {
            echo '## MLflow Candidate training submitted'
            echo
            echo "- Data release: \`$RELEASE_ID\`"
            echo "- Argo workflow: \`$WORKFLOW\`"
            echo '- Follow the Argo workflow; successful completion registers the `candidate` model alias in MLflow.'
          } >> "$GITHUB_STEP_SUMMARY"
