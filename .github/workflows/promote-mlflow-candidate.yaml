name: Promote MLflow Candidate

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: "Registered MLflow model name"
        required: true
        type: string
      model_version:
        description: "Candidate version to promote"
        required: true
        type: string
      policy:
        description: "Versioned promotion policy (local-demo never writes the production champion alias)"
        required: true
        default: local-demo
        type: choice
        options:
          - local-demo
          - production

permissions:
  contents: read

jobs:
  approve-and-promote:
    # Configure required reviewers for this environment in GitHub repository
    # settings. The deployment job will pause there before it can mutate MLflow.
    environment: ${{ inputs.policy == 'production' && 'model-production' || 'model-staging' }}
    runs-on: [self-hosted, mlforge]
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the immutable promotion policy
        id: policy
        env:
          POLICY_NAME: ${{ inputs.policy }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          policies = json.load(open("platform/model-promotion-policies.json"))
          policy = policies[os.environ["POLICY_NAME"]]
          print(f"metric_name={policy['metric_name']}")
          print(f"minimum={policy['minimum']}")
          print(f"target_alias={policy['target_alias']}")
          PY
      - name: Submit promotion gate to Argo
        id: argo
        env:
          MODEL_NAME: ${{ inputs.model_name }}
          MODEL_VERSION: ${{ inputs.model_version }}
          METRIC_NAME: ${{ steps.policy.outputs.metric_name }}
          MINIMUM: ${{ steps.policy.outputs.minimum }}
          TARGET_ALIAS: ${{ steps.policy.outputs.target_alias }}
        run: |
          workflow=$(cat <<EOF | kubectl --context k3d-workload -n ml-platform create -f - -o name
          apiVersion: argoproj.io/v1alpha1
          kind: Workflow
          metadata:
            generateName: promote-candidate-
            labels:
              app.kubernetes.io/part-of: mlforge
              mlforge.ai/trigger: approved-promotion
          spec:
            workflowTemplateRef:
              name: promote-mlflow-candidate
            arguments:
              parameters:
                - name: model-name
                  value: $MODEL_NAME
                - name: model-version
                  value: "$MODEL_VERSION"
                - name: metric-name
                  value: "$METRIC_NAME"
                - name: minimum
                  value: "$MINIMUM"
                - name: target-alias
                  value: "$TARGET_ALIAS"
          EOF
          )
          printf 'workflow=%s\n' "$workflow" >> "$GITHUB_OUTPUT"
      - name: Wait for the quality gate
        env:
          WORKFLOW: ${{ steps.argo.outputs.workflow }}
        run: |
          name=${WORKFLOW#workflow.argoproj.io/}
          kubectl --context k3d-workload -n ml-platform wait --for=jsonpath='{.status.phase}'=Succeeded "workflow/$name" --timeout=10m
      - name: Publish promotion summary
        env:
          WORKFLOW: ${{ steps.argo.outputs.workflow }}
          MODEL_NAME: ${{ inputs.model_name }}
          MODEL_VERSION: ${{ inputs.model_version }}
          POLICY: ${{ inputs.policy }}
          TARGET_ALIAS: ${{ steps.policy.outputs.target_alias }}
        run: |
          {
            echo '## Candidate promoted by governed policy'
            echo
            echo "- Model: \`$MODEL_NAME\`"
            echo "- Version: \`$MODEL_VERSION\`"
            echo "- Policy: \`$POLICY\`"
            echo "- Target alias: \`$TARGET_ALIAS\`"
            echo "- Argo audit workflow: \`$WORKFLOW\`"
            echo '- Next controlled action: deploy this promoted alias to the local Canary service.'
          } >> "$GITHUB_STEP_SUMMARY"
